name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Release 생성을 위한 권한 (Phase 14 이후 추가)
# 기존엔 contents:read 만 있어서 softprops/action-gh-release 403 실패
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python (for sidecar build — Option A)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LLVM
        run: choco install llvm -y

      - name: Set LLVM PATH
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Go backend
        env:
          BUNDLED_GROQ_KEY: ${{ secrets.GROQ_KEY }}
          BUNDLED_TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
          BUNDLED_OPENAI_KEY: ${{ secrets.VITE_OPENAI_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri\backend-bin | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          cd backend
          go mod tidy
          # 번들 키 ldflags 주입 — Free 사용자도 LLM/웹검색 즉시 사용 가능 (Pro 자체 키 시 오버라이드)
          $ldflags = "-s -w"
          if ($env:BUNDLED_GROQ_KEY)   { $ldflags += " -X 'main.bundledGroqKey=$env:BUNDLED_GROQ_KEY'" }
          if ($env:BUNDLED_TAVILY_KEY) { $ldflags += " -X 'main.bundledTavilyKey=$env:BUNDLED_TAVILY_KEY'" }
          if ($env:BUNDLED_OPENAI_KEY) { $ldflags += " -X 'main.bundledOpenAIKey=$env:BUNDLED_OPENAI_KEY'" }
          Write-Host "ldflags configured (keys masked)"
          go build -tags windows -ldflags="$ldflags" -o "..\src-tauri\binaries\backend-x86_64-pc-windows-msvc.exe" .
          cd ..
          Copy-Item "src-tauri\binaries\backend-x86_64-pc-windows-msvc.exe" "src-tauri\backend-bin\nexus-backend.exe"

      # Option A: 진짜 Python 사이드카 빌드 (PyInstaller)
      # 이전: Go 백엔드를 nexus-python.exe로 복사 (가짜 Python)
      # 이후: 실제 main.py + 26개 라우트 (OCR/PDF/임베딩/yt-dlp/주식/이메일AI 등)
      - name: Build Python sidecar (PyInstaller)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd backend/nexus_python
          Write-Host "📦 Installing Python deps (5-10 min, heavy ML libs)..."
          python -m pip install --upgrade pip setuptools wheel
          # 의존성 일부는 빌드 환경에서 깨질 수 있음 → 핵심만 강제 설치
          pip install --no-cache-dir `
            fastapi==0.115.0 uvicorn==0.30.6 requests==2.32.3 `
            httpx==0.27.2 aiofiles==24.1.0 python-multipart==0.0.12 `
            pyyaml==6.0.2 sqlalchemy==2.0.36 pillow==10.4.0 numpy==1.26.4 `
            PyMuPDF==1.24.11 pandas==2.2.3 openpyxl==3.1.5 `
            groq==0.11.0 ollama==0.3.3 pyautogui==0.9.54 pygetwindow==0.0.9 `
            pywinauto==0.6.8 pyperclip==1.9.0 pynput==1.7.7 comtypes
          # 무거운 ML 의존성 (easyocr, faiss, sentence-transformers) — 실패해도 빌드 계속
          pip install --no-cache-dir easyocr==1.7.2 faiss-cpu==1.9.0 sentence-transformers==3.2.1 scikit-learn==1.5.2 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ Heavy ML deps failed — sidecar will work without OCR/embeddings (graceful degradation)"
          }
          pip install pyinstaller==6.10.0
          Write-Host "🔨 PyInstaller 빌드 시작 (5-10 min)..."
          pyinstaller --onefile --name nexus-python --noconfirm `
            --hidden-import=uvicorn --hidden-import=uvicorn.lifespan `
            --hidden-import=uvicorn.lifespan.on --hidden-import=uvicorn.lifespan.off `
            --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.protocols.http.h11_impl `
            --hidden-import=uvicorn.protocols.websockets --hidden-import=uvicorn.protocols.websockets.auto `
            --hidden-import=uvicorn.protocols.websockets.wsproto_impl `
            --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.loops.asyncio `
            --collect-data fastapi `
            --hidden-import=pynput --collect-submodules pynput `
            --collect-submodules pywinauto --collect-all comtypes `
            main.py
          if (Test-Path "dist\nexus-python.exe") {
            $size = (Get-Item "dist\nexus-python.exe").Length / 1MB
            Write-Host "✅ Python sidecar built: $([math]::Round($size, 1)) MB"
            Copy-Item "dist\nexus-python.exe" "..\..\src-tauri\backend-bin\nexus-python.exe" -Force
          } else {
            Write-Host "❌ Python build failed — falling back to Go copy (no Python features)"
            Copy-Item "..\..\src-tauri\backend-bin\nexus-backend.exe" "..\..\src-tauri\backend-bin\nexus-python.exe" -Force
          }
          cd ..\..

      - name: Install npm dependencies
        run: npm install

      # ── 프론트엔드 VITE_* 주입 (관리자/구글 로그인·Supabase·Paddle) ──────────
      # 기존 버그: CI가 VITE_* 를 안 넣어 설치본의 import.meta.env.VITE_*가 전부 빈값.
      #   → ADMIN_EMAIL/PASSWORD='' (관리자 로그인 불일치), SUPABASE_URL=placeholder
      #     (구글 OAuth 실패 → trial 폴백 → 메인 직행). vite build 전에 .env.production 생성.
      # 필요 GitHub Secrets(없으면 빈값=현상태, 회귀 없음):
      #   VITE_ADMIN_EMAIL, VITE_ADMIN_PASSWORD, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
      #   VITE_PADDLE_CLIENT_TOKEN, VITE_PADDLE_PRICE_ID, VITE_PADDLE_PRICE_YEARLY,
      #   VITE_PADDLE_PRICE_PROPLUS, VITE_PADDLE_PRICE_PROPLUS_YEARLY,
      #   VITE_PADDLE_PRICE_TEAM5, VITE_PADDLE_PRICE_TEAM10, VITE_PADDLE_PRICE_ENT,
      #   VITE_PADDLE_ENVIRONMENT
      - name: Write frontend env (.env.production)
        shell: pwsh
        env:
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_PRICE_ID: ${{ secrets.VITE_PADDLE_PRICE_ID }}
          VITE_PADDLE_PRICE_YEARLY: ${{ secrets.VITE_PADDLE_PRICE_YEARLY }}
          VITE_PADDLE_PRICE_PROPLUS: ${{ secrets.VITE_PADDLE_PRICE_PROPLUS }}
          VITE_PADDLE_PRICE_PROPLUS_YEARLY: ${{ secrets.VITE_PADDLE_PRICE_PROPLUS_YEARLY }}
          VITE_PADDLE_PRICE_TEAM5: ${{ secrets.VITE_PADDLE_PRICE_TEAM5 }}
          VITE_PADDLE_PRICE_TEAM10: ${{ secrets.VITE_PADDLE_PRICE_TEAM10 }}
          VITE_PADDLE_PRICE_ENT: ${{ secrets.VITE_PADDLE_PRICE_ENT }}
          VITE_PADDLE_ENVIRONMENT: ${{ secrets.VITE_PADDLE_ENVIRONMENT }}
        run: |
          # 값은 env로만 전달(스크립트 텍스트에 secret 미주입 → 특수문자 안전).
          $keys = @(
            'VITE_ADMIN_EMAIL','VITE_ADMIN_PASSWORD','VITE_SUPABASE_URL','VITE_SUPABASE_ANON_KEY',
            'VITE_PADDLE_CLIENT_TOKEN','VITE_PADDLE_PRICE_ID','VITE_PADDLE_PRICE_YEARLY',
            'VITE_PADDLE_PRICE_PROPLUS','VITE_PADDLE_PRICE_PROPLUS_YEARLY',
            'VITE_PADDLE_PRICE_TEAM5','VITE_PADDLE_PRICE_TEAM10','VITE_PADDLE_PRICE_ENT','VITE_PADDLE_ENVIRONMENT'
          )
          $set = 0
          $lines = foreach ($k in $keys) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($v) { $set++ }
            "$k=$v"
          }
          ($lines -join "`n") | Out-File -FilePath ".env.production" -Encoding utf8NoBOM
          Write-Host "Wrote .env.production: $set/$($keys.Count) VITE_ vars set (values masked)"

      # ── 업데이터 버전 단조 증가 (Tauri --config 머지, 파일 변형 없음) ──────
      # 기존 버그: 앱 버전(tauri.conf.json)과 latest.json version이 매 빌드 "2.9.0"으로 동일
      #   → Tauri 업데이터가 신버전을 절대 감지 못해 자동 업데이트가 영구 미동작.
      # 수정: 빌드마다 2.9.<run_number>를 Tauri --config(JSON Merge Patch)로 주입.
      #       tauri.conf.json을 변형하지 않고(정규식 제거) 설치 바이너리 버전만 덮어씀.
      #       APP_VERSION env는 vite의 __APP_VERSION__ 주입(온보딩 버전 동기화)에도 함께 사용.
      - name: Build Tauri app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_VERSION: 2.9.${{ github.run_number }}
        run: |
          $cfgPath = Join-Path $PWD 'version-override.json'
          "{""version"":""$env:APP_VERSION""}" | Out-File -FilePath $cfgPath -Encoding utf8NoBOM
          Write-Host "Tauri version override → $(Get-Content $cfgPath -Raw)"
          npx tauri build --target x86_64-pc-windows-msvc --config $cfgPath

      - name: Generate latest.json for Tauri updater
        shell: pwsh
        env:
          TAG_NAME: v2.9.0-build${{ github.run_number }}
        run: |
          # ★ 설치 앱(tauri.conf.json)에 주입한 버전과 반드시 동일해야 업데이터 비교가 성립
          $version = "2.9.${{ github.run_number }}"
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          # 서명 파일 읽기
          $sigFile = Get-ChildItem "$bundleDir" -Filter "*.sig" | Select-Object -First 1
          $signature = ""
          if ($sigFile) {
            $signature = (Get-Content $sigFile.FullName -Raw).Trim()
            Write-Host "Signature file found: $($sigFile.Name)"
          } else {
            Write-Host "Warning: No .sig file found — updater signature will be empty"
          }
          # nsis.zip 파일명 확인
          $zipFile = Get-ChildItem "$bundleDir" -Filter "*.nsis.zip" | Select-Object -First 1
          $zipName = if ($zipFile) { $zipFile.Name } else { "Nexus_${version}_x64-setup.nsis.zip" }
          # 다운로드 URL (태그 기준)
          $tagName = $env:TAG_NAME
          $downloadBase = "https://github.com/sansarang/nexus-ai-releases/releases/download/$tagName"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          # latest.json 생성
          $json = [ordered]@{
            version  = $version
            notes    = "NEXUS AI v$version"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "$downloadBase/$zipName"
              }
            }
          } | ConvertTo-Json -Depth 5
          $json | Out-File -FilePath "latest.json" -Encoding utf8NoBOM
          Write-Host "latest.json 생성 완료:"
          Get-Content "latest.json"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Windows-x64-Setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sansarang/nexus-ai-releases
          tag_name: v2.9.0-build${{ github.run_number }}
          name: "NEXUS AI v2.9.0 (build ${{ github.run_number }})"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
            latest.json
          body: |
            ## NEXUS AI v2.9.0

            ### 설치 방법
            1. 아래 `Nexus_x64-setup.exe` 다운로드
            2. 더블클릭 -> 다음 -> 설치 완료
            3. Google 계정으로 로그인 후 시작

            ### 시스템 요구사항
            - Windows 10/11 64-bit
            - 인터넷 연결 필요

            [전체 기능 보기 -> nexusai.ai.kr](https://nexusai.ai.kr)

